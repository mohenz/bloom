<style>
  /* Zero radius policy enforcement */
  * { border-radius: 0px !important; }
  .hard-shadow {
    box-shadow: 4px 4px 0px 0px #1a1c1e;
  }
  .hard-shadow-md {
    box-shadow: 6px 6px 0px 0px #1a1c1e;
  }
  .hard-shadow-lg {
    box-shadow: 8px 8px 0px 0px #1a1c1e;
  }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    vertical-align: middle;
  }
  ::selection {
    background-color: #002366;
    color: white;
  }
  /* Button hover scale-effect matching Stitch code */
  .btn-hover-effect {
    transition: all 0.15s ease-in-out;
  }
  .btn-hover-effect:hover {
    transform: translate(-4px, -4px);
    box-shadow: 4px 4px 0px 0px #1a1c1e;
  }
  .btn-hover-effect:active {
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0px 0px #1a1c1e;
  }
</style>
<link rel="stylesheet" href="./prompt-generator/styles/app.css?v=20260608c">

<body class="bg-background text-on-surface antialiased font-body-md min-h-screen pb-xxl">

<div class="service-shell min-h-screen flex flex-col justify-between">
  <!-- STORY SCREEN -->
  <section class="screen story-screen" id="storyScreen">
    <header class="bg-surface w-full border-b-2 border-on-surface sticky top-0 z-50">
      <nav class="flex justify-between items-center max-w-[1280px] mx-auto px-lg md:px-margin-desktop py-md w-full">
        <div class="font-headline-md text-headline-md font-bold text-on-surface tracking-tighter flex items-center gap-sm">
          <span class="material-symbols-outlined text-[#783018]" data-icon="folder_open">folder_open</span>
          <span>STORY FILES</span>
        </div>
        <div class="flex items-center gap-md">
          <a class="border-2 border-on-surface px-md py-sm font-label-sm text-label-sm hover:bg-surface-container-low transition-all bg-white font-bold block text-center" href="./index.html">메인으로</a>
          <span class="font-label-sm text-label-sm bg-secondary-container text-on-secondary-container px-sm py-unit border border-on-surface font-bold flex items-center gap-xs" id="storyUserBadge"></span>
          <button class="border-2 border-on-surface px-md py-sm font-label-sm text-label-sm hover:bg-surface-container-low transition-all bg-white font-bold" id="storyLogoutBtn" type="button">로그아웃</button>
        </div>
      </nav>
    </header>

    <main class="max-w-[1180px] mx-auto px-lg py-xl">
      <section class="bg-surface border-2 border-on-surface p-xl hard-shadow">
        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-md mb-lg border-b border-outline-variant pb-md">
          <div class="space-y-xs">
            <div class="font-headline-md text-headline-md font-bold flex items-center gap-sm uppercase">
              <span class="material-symbols-outlined text-[#783018] text-[28px]" data-icon="folder_open">folder_open</span>
              Story Documents
            </div>
            <p class="font-label-sm text-[12.5px] text-on-surface-variant font-mono" id="storyStatus">스토리 문서를 불러오는 중입니다.</p>
          </div>
          <div class="flex flex-wrap items-center gap-sm w-full lg:w-auto">
            <input class="border-2 border-on-surface p-sm focus:border-primary focus:ring-0 outline-none font-body-md bg-white text-sm flex-grow sm:flex-grow-0 sm:w-48" id="storySearchInput" type="search" placeholder="스토리 파일 검색">
            <button class="border-2 border-on-surface px-md py-sm bg-primary text-on-primary font-label-sm text-label-sm hover:bg-primary-container btn-hover-effect font-bold flex items-center gap-xs" id="storySyncBtn" type="button">
              <span class="material-symbols-outlined text-[16px]" data-icon="sync">sync</span>로컬 파일 동기화
            </button>
            <button class="border-2 border-on-surface px-md py-sm bg-white text-on-surface font-label-sm text-label-sm hover:bg-surface-container-low btn-hover-effect font-bold flex items-center gap-xs" id="storyAddGroupBtn" type="button">
              <span class="material-symbols-outlined text-[16px]" data-icon="create_new_folder">create_new_folder</span>그룹 추가
            </button>
            <button class="border-2 border-on-surface px-md py-sm bg-white text-on-surface font-label-sm text-label-sm hover:bg-surface-container-low btn-hover-effect font-bold flex items-center gap-xs" id="storyAddDocBtn" type="button">
              <span class="material-symbols-outlined text-[16px]" data-icon="note_add">note_add</span>문서 추가
            </button>
          </div>
        </div>
        
        <div class="space-y-sm" id="storyTreeContainer"></div>
      </section>
    </main>
  </section>
</div>

<!-- Story Editor Modal -->
<div class="story-modal is-hidden" id="storyModal" role="dialog" aria-modal="true" aria-labelledby="storyModalTitle">
  <div class="story-modal-backdrop" id="storyModalBackdrop"></div>
  <section class="story-modal-panel relative z-10 w-[90%] max-w-[1000px] h-[80vh] border-2 border-on-surface bg-white hard-shadow-lg flex flex-col justify-between overflow-hidden">
    <header class="story-modal-header border-b-2 border-on-surface p-lg flex justify-between items-center">
      <div>
        <p class="font-label-sm text-[11.5px] text-on-surface-variant font-mono" id="storyModalPath"></p>
        <h2 class="font-headline-md text-headline-md font-bold text-primary uppercase" id="storyModalTitle">Story</h2>
      </div>
      <div class="flex items-center gap-sm">
        <button class="border border-on-surface px-md py-sm font-label-sm text-label-sm hover:bg-surface-container-low transition-all bg-white font-bold flex items-center gap-xs" id="storyModalToggleSidebarBtn" type="button">
          <span class="material-symbols-outlined text-[16px]" id="storyModalToggleSidebarIcon" data-icon="menu_open">menu_open</span><span id="storyModalToggleSidebarText">속성 창 접기</span>
        </button>
        <button class="border border-on-surface px-md py-sm font-label-sm text-label-sm hover:bg-surface-container-low transition-all bg-white font-bold flex items-center gap-xs" id="storyModalCloseBtn" type="button">
          <span class="material-symbols-outlined text-[16px]" data-icon="close">close</span>닫기
        </button>
      </div>
    </header>
    <div class="flex-grow flex flex-col md:flex-row overflow-hidden">
      <!-- Editor -->
      <textarea class="story-editor flex-grow p-xl outline-none font-mono text-sm leading-relaxed bg-white border-0 resize-none overflow-y-auto md:w-[70%]" id="storyEditor" spellcheck="false"></textarea>
      <!-- Sidebar -->
      <aside id="storyModalSidebar" class="w-full md:w-[30%] border-t-2 md:border-t-0 md:border-l-2 border-on-surface p-lg bg-surface-container-low overflow-y-auto flex flex-col gap-lg">
        <!-- Properties -->
        <div class="space-y-sm">
          <h3 class="font-label-md text-label-md font-bold text-primary border-b border-outline-variant pb-xs">문서 속성</h3>
          <div>
            <label class="block font-label-sm text-[11px] text-on-surface-variant mb-xs" for="storyModalGroupSelect">그룹</label>
            <select class="w-full border border-on-surface p-sm bg-white font-body-md text-sm" id="storyModalGroupSelect"></select>
          </div>
          <div>
            <label class="block font-label-sm text-[11px] text-on-surface-variant mb-xs" for="storyModalParentSelect">상위 문서 (부모)</label>
            <select class="w-full border border-on-surface p-sm bg-white font-body-md text-sm" id="storyModalParentSelect"></select>
          </div>
          <div>
            <label class="block font-label-sm text-[11px] text-on-surface-variant mb-xs" for="storyModalSortOrder">정렬 순서</label>
            <input class="w-full border border-on-surface p-sm bg-white font-body-md text-sm" id="storyModalSortOrder" type="number" min="0" value="0">
          </div>
        </div>
        <!-- Connectivity / References -->
        <div class="space-y-sm flex-grow flex flex-col">
          <h3 class="font-label-md text-label-md font-bold text-primary border-b border-outline-variant pb-xs">문서 연결성 (참조)</h3>
          
          <!-- Add Link -->
          <div class="flex gap-xs mt-sm">
            <select class="flex-grow border border-on-surface p-sm bg-white font-body-md text-sm" id="storyModalLinkDocSelect"></select>
            <button class="border-2 border-on-surface bg-white text-on-surface px-md py-sm font-label-sm text-[12px] hover:bg-surface-container-low font-bold flex items-center justify-center gap-xs" id="storyModalAddLinkBtn" type="button">
              <span class="material-symbols-outlined text-[16px]" data-icon="add">add</span>연결
            </button>
          </div>
          
          <!-- References list -->
          <div class="flex-grow border border-on-surface p-sm bg-white overflow-y-auto min-h-[150px] space-y-sm" id="storyModalReferencesList"></div>
        </div>
      </aside>
    </div>
    <footer class="story-modal-actions border-t-2 border-on-surface p-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-md">
      <span class="font-label-sm text-[12.5px] text-on-surface-variant font-mono" id="storyEditStatus">수정 내용은 브라우저에 저장됩니다.</span>
      <div class="flex gap-sm w-full sm:w-auto">
        <button class="flex-grow sm:flex-grow-0 border border-on-surface bg-white text-on-surface font-label-sm text-label-sm px-md py-sm hover:bg-surface-container-low transition-all font-bold flex items-center justify-center gap-xs" id="storyResetBtn" type="button">
          <span class="material-symbols-outlined text-[16px]" data-icon="undo">undo</span>원본 복원
        </button>
        <button class="flex-grow sm:flex-grow-0 border border-on-surface bg-secondary-container text-on-secondary-container font-label-sm text-label-sm px-md py-sm hover:bg-secondary-fixed-dim transition-all font-bold flex items-center justify-center gap-xs" id="storyCopyBtn" type="button">
          <span class="material-symbols-outlined text-[16px]" data-icon="content_copy">content_copy</span>복사
        </button>
        <button class="flex-grow sm:flex-grow-0 border-2 border-on-surface bg-primary text-on-primary font-label-sm text-label-sm px-lg py-sm hover:bg-primary-container transition-all font-bold flex items-center justify-center gap-xs" id="storySaveBtn" type="button">
          <span class="material-symbols-outlined text-[16px]" data-icon="save">save</span>저장
        </button>
      </div>
    </footer>
  </section>
</div>

<!-- Copy Toast Notification -->
<div class="copy-toast" id="copyToast">✓ 복사됨</div>

<!-- Dynamic App Scripts -->
<script defer src="./prompt-generator/data/story-manifest.js?v=story1"></script>
<script type="module" src="./prompt-generator/ui/story.js?v=story1"></script>
</body>
</html>
