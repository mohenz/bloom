<style>
  /* Zero radius policy enforcement */
  * { border-radius: 0px !important; }
  .hard-shadow {
    box-shadow: 4px 4px 0px 0px #1a1c1e;
  }
  .hard-shadow-md {

    background-color: #002366;
    color: white;
  }
  /* Button hover scale-effect matching Stitch code */
  .btn-hover-effect {
    transition: all 0.15s ease-in-out;
  }
  .btn-hover-effect:hover {
    transform: translate(-4px, -4px);
    box-shadow: 4px 4px 0px 0px #1a1c1e;
  }
  .btn-hover-effect:active {
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0px 0px #1a1c1e;

<body class="bg-background text-on-surface antialiased font-body-md min-h-screen pb-xxl">

<div class="service-shell min-h-screen flex flex-col justify-between">
  <!-- PROMPT HISTORY SCREEN -->
  <section class="screen prompt-history-screen" id="promptHistoryScreen">
    <header class="bg-surface w-full border-b-2 border-on-surface sticky top-0 z-50">
      <nav class="flex justify-between items-center max-w-[1280px] mx-auto px-lg md:px-margin-desktop py-md w-full">
        <div class="font-headline-md text-headline-md font-bold text-on-surface tracking-tighter flex items-center gap-sm">
          <span class="material-symbols-outlined text-primary" data-icon="history">history</span>
          <span>PROMPT HISTORY</span>
        </div>
        <div class="flex items-center gap-md">
          <a class="border-2 border-on-surface px-md py-sm font-label-sm text-label-sm hover:bg-surface-container-low transition-all bg-white font-bold block text-center" href="./index.html">메인으로</a>
          <a class="border-2 border-on-surface px-md py-sm font-label-sm text-label-sm hover:bg-surface-container-low transition-all bg-white font-bold block text-center" href="./builder.html">Builder 열기</a>
          <button class="border-2 border-on-surface px-md py-sm font-label-sm text-label-sm hover:bg-surface-container-low transition-all bg-white font-bold" id="refreshHistoryBtn" type="button">새로고침</button>
          <button class="border-2 border-on-surface px-md py-sm font-label-sm text-label-sm hover:bg-surface-container-low transition-all bg-white font-bold" id="historyLogoutBtn" type="button">로그아웃</button>
        </div>
      </nav>
    </header>

    <main class="max-w-[1280px] mx-auto px-lg md:px-margin-desktop py-xl">
      <!-- Hero Section -->
      <section class="pb-xl border-b-2 border-on-surface mb-xl">
        <p class="font-label-sm text-label-sm text-on-surface-variant opacity-75 tracking-wider block mb-xs uppercase font-mono">Archive Manager</p>
        <h2 class="font-display-lg text-display-lg-mobile md:text-display-lg leading-[0.9] mb-md uppercase">
          Prompt Archive
        </h2>
        <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl">
          생성한 프롬프트를 생성일시 기준으로 저장하고 불러와 수정하거나 삭제합니다.
        </p>
      </section>

      <section class="bg-surface border-2 border-on-surface p-xl hard-shadow">
        <div class="mb-lg border-b border-outline-variant pb-md">
          <div class="font-headline-md text-headline-md font-bold flex items-center gap-sm uppercase">
            <span class="material-symbols-outlined text-primary text-[28px]" data-icon="history">history</span>
            Saved Items
          </div>
          <p class="font-label-sm text-[12.5px] text-on-surface-variant mt-xs font-mono" id="historyStatus">저장된 프롬프트를 불러오는 중입니다.</p>
        </div>
        <p class="font-body-md text-body-md text-on-surface-variant py-lg text-center" id="historyEmpty">저장된 프롬프트가 없습니다. Prompt Builder에서 저장을 먼저 진행해주세요.</p>
        
        <div class="space-y-md" id="historyList"></div>
      </section>
    </main>
  </section>
</div>
