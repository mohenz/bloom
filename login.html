<style>
  /* Zero radius policy enforcement */
  * { border-radius: 0px !important; }
  .hard-shadow {
    box-shadow: 4px 4px 0px 0px #1a1c1e;
  }
  .hard-shadow-md {
    box-shadow: 6px 6px 0px 0px #1a1c1e;
  }
  .hard-shadow-lg {
    box-shadow: 8px 8px 0px 0px #1a1c1e;
  }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    vertical-align: middle;
  }
  ::selection {
    background-color: #002366;
    color: white;
  }
  /* Button hover scale-effect matching Stitch code */
  .btn-hover-effect {
    transition: all 0.15s ease-in-out;
  }
  .btn-hover-effect:hover {
    transform: translate(-4px, -4px);
    box-shadow: 4px 4px 0px 0px #1a1c1e;
  }
  .btn-hover-effect:active {
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0px 0px #1a1c1e;
  }
  /* Custom display state */
  .is-hidden { display: none !important; }
</style>

<body class="bg-background text-on-surface antialiased font-body-md min-h-screen flex flex-col justify-between">

<div class="service-shell flex-grow flex flex-col justify-between">
  <!-- LOGIN SCREEN -->
  <section class="screen login-screen flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-background" id="loginScreen">
    <div class="login-panel max-w-[1000px] w-full grid grid-cols-1 md:grid-cols-12 gap-gutter items-center">
      <!-- Left Panel: Brand info -->
      <div class="md:col-span-6 bg-surface border-2 border-on-surface p-xl hard-shadow flex flex-col justify-center min-h-[320px]">
        <h1 class="font-display-lg text-display-lg-mobile md:text-display-lg leading-[0.9] font-bold text-primary mb-md uppercase">Bloom Universe</h1>
        <div class="h-2 w-32 bg-primary mb-lg"></div>
      </div>

      <!-- Right Panel: Login card -->
      <div class="md:col-span-6 bg-surface border-2 border-on-surface p-xl hard-shadow min-h-[320px]">
        <div class="flex items-center gap-sm mb-lg border-b-2 border-on-surface pb-sm">
          <span class="material-symbols-outlined text-primary text-[24px]" data-icon="login">login</span>
          <h2 class="font-headline-md text-headline-md font-bold uppercase tracking-wide">로그인</h2>
        </div>
        <form class="space-y-lg" id="loginForm">
          <div>
            <label class="block font-label-md text-label-md text-on-surface mb-xs" for="emailInput">이메일</label>
            <input class="w-full border-2 border-on-surface p-md focus:border-primary focus:ring-0 outline-none font-body-md" id="emailInput" name="email" type="email" autocomplete="username" placeholder="user@example.com" required>
          </div>
          <div>
            <label class="block font-label-md text-label-md text-on-surface mb-xs" for="passwordInput">비밀번호</label>
            <input class="w-full border-2 border-on-surface p-md focus:border-primary focus:ring-0 outline-none font-body-md" id="passwordInput" name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required>
          </div>
          <div class="flex justify-between items-center font-label-sm text-label-sm">
            <p class="text-on-surface-variant" id="loginHelp">이메일과 비밀번호로 로그인합니다.</p>
            <button class="text-primary hover:underline font-bold" id="openResetModalBtn" type="button">비밀번호 재설정</button>
          </div>
          <p class="font-label-sm text-label-sm text-error bg-error-container border-2 border-on-surface p-sm font-semibold is-hidden" id="loginError">이메일 또는 비밀번호가 올바르지 않습니다.</p>
          
          <button class="w-full bg-primary text-on-primary py-md font-label-md text-label-md uppercase tracking-widest border-2 border-on-surface btn-hover-effect flex justify-center items-center gap-sm" id="loginSubmitBtn" type="submit">
            로그인
            <span class="material-symbols-outlined text-[18px]" data-icon="login">login</span>
          </button>
          
          <div class="space-y-sm pt-sm is-hidden" id="loginAltActions">
            <button class="w-full bg-secondary-container text-on-secondary-container py-md font-label-md text-label-md uppercase tracking-wider border-2 border-on-surface btn-hover-effect" id="openHostedAppBtn" type="button">정식 앱 열기</button>
            <button class="w-full bg-white text-on-surface py-md font-label-md text-label-md uppercase tracking-wider border-2 border-on-surface btn-hover-effect" id="guestPreviewBtn" type="button">게스트로 둘러보기</button>
          </div>
        </form>
      </div>
    </div>
  </section>
</div>

<!-- Password Reset Modal -->
<div class="story-modal is-hidden" id="resetPasswordModal" role="dialog" aria-modal="true" aria-labelledby="resetModalTitle">
  <div class="story-modal-backdrop" id="resetModalBackdrop"></div>
  <section class="story-modal-panel relative z-10 w-[90%] max-w-[500px] border-2 border-on-surface bg-white hard-shadow-lg flex flex-col justify-between overflow-hidden p-xl">
    <header class="border-b-2 border-on-surface pb-sm mb-lg flex justify-between items-center">
      <div class="flex items-center gap-sm">
        <span class="material-symbols-outlined text-primary text-[24px]" data-icon="lock_reset">lock_reset</span>
        <h2 class="font-headline-md text-headline-md font-bold uppercase tracking-wide" id="resetModalTitle">비밀번호 재설정</h2>
      </div>
      <button class="text-on-surface-variant hover:text-on-surface" id="closeResetModalBtn" type="button">
        <span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
      </button>
    </header>
    
    <form class="space-y-md" id="resetPasswordForm">
      <div>
        <label class="block font-label-md text-label-md text-on-surface mb-xs" for="resetEmailInput">이메일</label>
        <input class="w-full border-2 border-on-surface p-md focus:border-primary focus:ring-0 outline-none font-body-md" id="resetEmailInput" type="email" placeholder="user@example.com" required>
      </div>
      <div>
        <label class="block font-label-md text-label-md text-on-surface mb-xs" for="resetMasterKeyInput">마스터 시큐리티 키</label>
        <input class="w-full border-2 border-on-surface p-md focus:border-primary focus:ring-0 outline-none font-body-md" id="resetMasterKeyInput" type="password" placeholder="마스터 시큐리티 키를 입력하세요" required>
      </div>
      <div>
        <label class="block font-label-md text-label-md text-on-surface mb-xs" for="resetPasswordInput">새 비밀번호</label>
        <input class="w-full border-2 border-on-surface p-md focus:border-primary focus:ring-0 outline-none font-body-md" id="resetPasswordInput" type="password" placeholder="새 비밀번호" required>
      </div>
      <div>
        <label class="block font-label-md text-label-md text-on-surface mb-xs" for="resetPasswordConfirmInput">새 비밀번호 확인</label>
        <input class="w-full border-2 border-on-surface p-md focus:border-primary focus:ring-0 outline-none font-body-md" id="resetPasswordConfirmInput" type="password" placeholder="새 비밀번호 확인" required>
      </div>
      
      <p class="font-label-sm text-label-sm text-error bg-error-container border-2 border-on-surface p-sm font-semibold is-hidden" id="resetError"></p>
      
      <button class="w-full bg-primary text-on-primary py-md font-label-md text-label-md uppercase tracking-widest border-2 border-on-surface btn-hover-effect flex justify-center items-center gap-sm mt-lg" id="resetSubmitBtn" type="submit">
        재설정 실행
        <span class="material-symbols-outlined text-[18px]" data-icon="done">done</span>
      </button>
    </form>
  </section>
</div>

<!-- Copy Toast Notification -->
<div class="copy-toast" id="copyToast">✓ 복사됨</div>

<!-- Dynamic Scripts -->
<script type="module" src="./prompt-generator/ui/login.js?v=story2"></script>
